name: Update Blocklists

on:
  schedule:
    - cron: '0 3 * * 1'   # раз в неделю (понедельник 03:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Клонируем репозиторий
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # 2️⃣ Подготовка ветки
      - name: Prepare blocklist branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # подключаем origin с токеном
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/slavsut/blocklist-repo.git

          # получаем ветку (если есть)
          git fetch origin blocklist || true

          # создаём или синхронизируем ветку
          git checkout -B blocklist origin/blocklist || git checkout -b blocklist

          # очищаем мусор
          git clean -fd

      # 3️⃣ Установка зависимостей (если нужно)
      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl

      # 4️⃣ Генерация списков
      - name: Run update script
        run: bash firehol_attacks_level2.sh

      # 5️⃣ Проверка (не пустой файл)
      - name: Verify files
        run: |
          if [ ! -s blocklist.firehol_attacks_level2.netset ]; then
            echo "ERROR: file is empty"
            exit 1
          fi

      # 6️⃣ Коммит и push
      - name: Push changes
        run: |
          git add *.netset
          git commit -m "auto update blocklists" || echo "no changes"

          # force нужен для CI (чтобы не было fetch/merge проблем)
          git push --force origin blocklist
