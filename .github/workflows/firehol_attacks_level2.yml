name: Update blocklist.firehol_attacks_level2.netset

on:
  schedule:
    - cron: '0 0 * * 0/3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # Клонируем репозиторий БЕЗ сохранения токена
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Убираем origin чтобы исключить push в main
      - name: Remove origin
        run: git remote remove origin

      # Устанавливаем curl
      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl

      # Запускаем скрипт обновления
      - name: Run update script
        run: bash firehol_attacks_level2.sh

      # Проверяем что файл не пустой
      - name: Verify file
        run: |
          if [ ! -s blocklist.firehol_attacks_level2.netset ]; then
            echo "ERROR: blocklist is empty"
            exit 1
          fi

      # Пушим только в ветку blocklist
      - name: Push to blocklist branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/slavsut/blocklist-repo.git

          git fetch origin || true
          git checkout  blocklist || git checkout -b blocklist

          git add blocklist.firehol_attacks_level2.netset
          
          git commit -m "update blocklist" || echo "no changes"

          git push origin blocklist
