name: Update Blocklist

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # Клонируем репозиторий БЕЗ сохранения токена
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Убираем origin чтобы исключить push в main
      - name: Remove origin
        run: git remote remove origin

      # Устанавливаем curl
      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl

      # Запускаем скрипт обновления
      - name: Run update script
        run: bash update.sh

      # Проверяем что файл не пустой
      - name: Verify file
        run: |
          if [ ! -s blocklist.netset ]; then
            echo "ERROR: blocklist is empty"
            exit 1
          fi

      # Пушим только в ветку blocklist
      - name: Push to blocklist branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          rm -rf out
          mkdir out
          cp blocklist.netset out/

          cd out
          git init -b blocklist

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add blocklist.netset
          git commit -m "update blocklist"

          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/slavsut/blocklist-repo.git
          git push --force origin blocklist
