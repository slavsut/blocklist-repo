name: Update Blocklist

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Run update script
        run: bash update.sh

      - name: Push to blocklist branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          mkdir out
          cp blocklist.netset out/

          cd out
          git init
          git checkout -b blocklist

          git add blocklist.netset
          git commit -m "update blocklist"

          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/slavsut/blocklist-repo.git
          git push --force origin blocklist
