name: Update Blocklist

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
           persist-credentials: false
     
      - name: Remove origin
        run: git remote remove origin
      

      - name: DEBUG FILE
        run: cat .github/workflows/update.yml

      # 💀 убиваем связь с main
      - name: Disable default git
        run: git remote remove origin

      - name: Run update script
        run: bash update.sh

      - name: Verify file
        run: |
          if [ ! -s blocklist.netset ]; then
            echo "ERROR: blocklist is empty"
            exit 1
          fi

      - name: Push to blocklist branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          rm -rf out
          mkdir out
          cp blocklist.netset out/

          cd out
          git init -b blocklist

          git add blocklist.netset
          git commit -m "update blocklist"

          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/slavsut/blocklist-repo.git
          git push --force origin blocklist
