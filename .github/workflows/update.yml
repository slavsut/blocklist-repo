name: Update Blocklist

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ✅ Клонируем репо БЕЗ токена (важно)
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # 💀 Убираем origin чтобы исключить push в main
      - name: Remove origin
        run: git remote remove origin

      # 🚀 Генерация блоклиста
      - name: Run update script
        run: bash update.sh

      # 🔍 Проверка (чтобы не залить пустой файл)
      - name: Verify file
        run: |
          if [ ! -s blocklist.netset ]; then
            echo "ERROR: blocklist is empty"
            exit 1
          fi
      #- name: Push to blocklist branch
      - run: |
          if [ ! -s blocklist.netset ]; then
            echo "empty file"
            exit 1
          fi

      - run: |
          mkdir out
          cp blocklist.netset out/
          cd out

          git init -b blocklist
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "update"

          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/slavsut/blocklist-repo.git
          git push --force origin blocklist

